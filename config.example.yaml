# MoonLan — example configuration.
# Copy to config.yaml and edit for your network.
# MoonLan — пример конфигурации.
# Скопируйте в config.yaml и отредактируйте под свою сеть.

listen:
  host: 0.0.0.0     # address the web UI listens on
                    # на каком адресе слушать веб-интерфейс
  port: 8080

snmp:
  community: public # SNMP v2c community (read-only)
                    # SNMP v2c community (только чтение)
  timeout: 2        # seconds to wait for a reply
                    # секунд на ответ
  retries: 1

# IP addresses of managed switches
# IP-адреса управляемых коммутаторов
switches:
  - 192.168.1.2
  - 192.168.1.3

# Devices with an ARP table (routers, L3 switches) —
# MoonLan learns host IPs from them by MAC
# Устройства с ARP-таблицей (маршрутизаторы, L3-коммутаторы) —
# из них MoonLan узнаёт IP-адреса хостов по их MAC
routers:
  - 192.168.1.1

# Periodic scan, minutes (0 — manual only via /api/scan)
# Периодический автоопрос, минут (0 — только вручную через /api/scan)
scan_interval_minutes: 10

# How often to ping hosts and switches, seconds
# Как часто пинговать хосты и коммутаторы, секунд
ping_interval_seconds: 60

# How often to poll port traffic/error counters, seconds
# Как часто опрашивать счётчики трафика и ошибок портов, секунд
counters_interval_seconds: 60

# Database file (hosts, event journal)
# Файл базы данных (хосты, журнал событий)
db_path: moonlan.db

# If more hosts than this are found behind one (non-uplink) port,
# a "switch without SNMP" node is drawn (0 — disable)
# Если на порту (не магистральном) найдено больше стольких хостов,
# на схеме рисуется «коммутатор без SNMP» (0 — отключить)
unmanaged_threshold: 3

# Alarm host_down only for hosts marked "Monitor" in the UI.
# true = old behavior: every host raises host_down.
# host_down только для хостов с флагом «Наблюдать» в интерфейсе.
# true = старое поведение: тревога по каждому хосту.
monitored_by_default: false

# How long a host stays on the map after its MAC left the switch MAC
# tables (they age out in minutes, so quiet devices must not blink),
# and how long it is kept in the database at all.
# Сколько времени хост остаётся на карте после исчезновения его MAC
# из таблиц коммутаторов (они стареют за минуты, поэтому «тихие»
# устройства не должны мигать) и сколько хранится в базе.
host_grace_hours: 24
host_retention_days: 30

# Devices that are offline on the same port hang off one node
# "Offline · N" instead of a cloud of grey dots around the switch
# (0 — no grouping). The devices themselves stay on the map.
# Офлайн-устройства на одном порту собираются под узлом «Офлайн · N»
# вместо облака серых точек вокруг коммутатора (0 — не группировать).
# Сами устройства остаются на карте.
offline_group_threshold: 2

# A host whose MAC is gone from every switch table and whose IP no ARP
# table has confirmed for this long gives the address up: another
# device may hold it, and its replies would fake the old host alive.
# Хост, чей MAC исчез из таблиц коммутаторов, а IP столько времени не
# подтверждался ARP, освобождает адрес: им может владеть другое
# устройство, и его ответы выдавали бы старую запись за живую.
ip_confirm_hours: 6

# How many polls a brand-new MAC must appear in before it becomes a
# device on the map. A MAC ARP already knows by IP is taken at once, so
# real newcomers are not delayed; damaged frames invent addresses that
# live for a poll or two and now never reach the map (1 — old behavior).
# Сколько опросов новый MAC должен подтвердиться, прежде чем станет
# устройством на карте. MAC, известный ARP по IP, принимается сразу,
# поэтому реальные устройства не задерживаются; повреждённые кадры
# порождают адреса-однодневки, и они больше не попадают на карту
# (1 — прежнее поведение).
new_host_confirm_scans: 2

# Keep addresses that look like damaged copies of a real one (see
# thresholds.corruption_*) off the map. false draws them instead —
# a way to see the damage rather than only be told about it.
# Не показывать на карте адреса, похожие на искажённые копии реального
# (см. thresholds.corruption_*). false — рисовать их: способ увидеть
# повреждение своими глазами, а не только прочитать о нём в тревоге.
filter_suspect_macs: true

# A device no switch sees on a host port — only on trunks — sits behind
# equipment MoonLan does not poll. true draws it on the trunk it was
# seen through, marked "approximate"; false leaves it off the map.
# Устройство, которое ни один коммутатор не видит на пользовательском
# порту (только на магистралях), подключено за неопрашиваемым
# оборудованием. true — рисовать его на магистрали с пометкой
# «приблизительно»; false — не показывать на карте.
place_trunk_only_hosts: true

# Bridges that are supposed to be behind an access port: LLDP finds
# them, the map names them, but no unmanaged_bridge_detected alarm is
# raised. List a chassis id (MAC) or a management IP address.
# Мосты, которым положено стоять за портом доступа: LLDP их находит,
# карта показывает по имени, но тревога unmanaged_bridge_detected по
# ним не поднимается. Указывайте chassis id (MAC) или управляющий IP.
known_bridges: []
#  - 18:fd:74:fd:b5:cf
#  - 10.3.5.6

# Ports that leave the network: a provider handover, an uplink to
# someone else's equipment. Written as "<switch ip>:<port name>", the
# port name exactly as the ports panel shows it. Devices behind such a
# port are collected under one "External network" node instead of being
# drawn one by one, and a switch found there raises no bridge alarm —
# it is the boundary of your network, not something left unconfigured.
# Порты, ведущие наружу: стык с провайдером, аплинк к чужому
# оборудованию. Записываются как «<IP коммутатора>:<имя порта>», имя
# порта — ровно как в панели портов. Устройства за таким портом
# собираются в один узел «Внешняя сеть» вместо россыпи, а найденный там
# коммутатор не поднимает тревогу о мосте: это граница вашей сети, а не
# чья-то забытая настройка.
uplink_ports: []
#  - 10.0.0.10:Slot0/25

# Alarm thresholds / Пороги тревог
thresholds:
  # Errors are damaged frames (cable, duplex, transceiver) — rare and
  # worth a warning; discards are usually normal filtering (VLAN rules,
  # storm control, bursts) and get their own, much quieter alarm.
  # Ошибки — испорченные кадры (кабель, дуплекс, трансивер), редки и
  # заслуживают предупреждения; отбрасывания — обычно штатная
  # фильтрация (VLAN, storm control, всплески), у них своя тихая тревога.
  errors_per_minute: 5           # port_errors: ifInErrors+ifOutErrors
  error_ratio_percent: 0.01      # and at least this share of all frames
                                 # и не меньше такой доли всех кадров
  discards_per_minute: 500       # port_discards (info, syslog only)
  port_alarm_cycles: 3           # cycles over/under a threshold before
                                 # an alarm is raised or cleared
                                 # циклов подряд до поднятия/снятия
  port_utilization_percent: 90   # port_util: % of the link speed
                                 # (for a LAG — of the total speed)
                                 # % от скорости линка (для LAG — от суммарной)
  # Frame corruption: a failing cable makes the switch learn addresses
  # a few bits away from the real one. How far a MAC may sit from a
  # confirmed one on the same port and still be read as its damaged
  # copy, and how many copies raise port_frame_corruption within
  # notifications.flap_window_seconds.
  # Повреждение кадров: из-за плохого кабеля коммутатор учит адреса,
  # отличающиеся от настоящего на несколько бит. На сколько бит MAC
  # может отличаться от подтверждённого на том же порту, чтобы считаться
  # его искажённой копией, и сколько таких копий за окно
  # notifications.flap_window_seconds поднимают port_frame_corruption.
  corruption_hamming_bits: 8
  corruption_macs_threshold: 5
  # Spanning tree. A converging tree produces a handful of topology
  # changes; a flapping link produces a stream. Raised only for
  # switches whose tree actually operates — a switch with STP off
  # still answers dot1dStp* and names itself root.
  # Остовное дерево. Сходящееся дерево даёт единицы изменений
  # топологии, «дребезжащая» связь — поток. Тревоги поднимаются только
  # по коммутаторам, у которых дерево реально работает: с выключенным
  # STP коммутатор всё равно отвечает на dot1dStp* и называет корнем
  # себя.
  stp_changes_per_cycle: 3       # stp_topology_change: changes per scan
                                 # изменений топологии за один опрос
  # Port flapping. A port can bounce several times between two counter
  # polls, so ifLastChange is read alongside ifOperStatus.
  # Флаппинг порта. Порт может несколько раз «моргнуть» между двумя
  # опросами счётчиков, поэтому вместе с ifOperStatus читается
  # ifLastChange.
  flaps_per_window: 4            # port_flapping: link transitions
                                 # переходов состояния линка
  flap_window_minutes: 10        # …inside this window / …за это окно
  mass_down_hosts: 3             # port_hosts_down: devices (unique IPs)
                                 # of one port gone silent in one ping
                                 # cycle (0 — disable)
                                 # устройств (уникальных IP) одного порта,
                                 # замолчавших за один ping-цикл (0 — откл.)

# Notification channels. Keep the real config.yaml (with passwords and
# tokens) OUT of git — it is listed in .gitignore.
# Каналы уведомлений. Храните боевой config.yaml (с паролями и токенами)
# ВНЕ git — он указан в .gitignore.
notifications:
  cooldown_seconds: 300      # anti-spam per (type, subject)
                             # антиспам на (тип, объект)
  # Flap damping: this many raises of one subject within the window
  # mute its notifications until it stays quiet for flap_quiet_seconds
  # Подавление флаппинга: столько подъёмов одного субъекта за окно
  # глушат его уведомления до flap_quiet_seconds тишины
  flap_count: 3
  flap_window_seconds: 7200
  flap_quiet_seconds: 3600
  email:
    enabled: false
    smtp_host: smtp.example.com
    smtp_port: 587
    starttls: true
    username: ""
    password: ""
    mail_from: moonlan@example.com
    mail_to: [admin@example.com]
  telegram:
    enabled: false
    bot_token: ""              # Bot API token from @BotFather
    chat_ids: []               # e.g. [123456789]
  syslog:
    enabled: false
    host: 127.0.0.1
    port: 514

# Which alarm types go to which channels
# Какие типы тревог в какие каналы отправлять
alarm_notify:
  host_down: [email, telegram, syslog]
  switch_down: [email, telegram, syslog]
  port_errors: [syslog]
  port_discards: [syslog]
  port_util: [telegram, syslog]
  new_mac: [syslog]
  port_hosts_down: [email, telegram, syslog]
  lag_degraded: [telegram, syslog]
  port_frame_corruption: [telegram, syslog]
  unmanaged_bridge_detected: [telegram, syslog]
  stp_root_changed: [telegram, syslog]
  stp_topology_change: [telegram, syslog]
  stp_fragmented: [telegram, syslog]
  port_flapping: [telegram, syslog]
