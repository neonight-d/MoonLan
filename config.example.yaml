# MoonLan — example configuration.
# Copy to config.yaml and edit for your network.
# MoonLan — пример конфигурации.
# Скопируйте в config.yaml и отредактируйте под свою сеть.

listen:
  host: 0.0.0.0     # address the web UI listens on
                    # на каком адресе слушать веб-интерфейс
  port: 8080
  # The address people open the map at (v0.7.6): a host NAME, not an IP —
  # signing in with a key is bound to it. Unset: as before, no passkeys.
  # Адрес, по которому карту открывают люди (v0.7.6): ИМЯ хоста, не IP —
  # к нему привязывается вход по ключу. Не задан — как раньше, без ключей.
  # public_url: https://example.local:8443
  # HTTPS served by MoonLan itself: certificate and key, PEM (both or
  # neither). See docs/HTTPS.md for making them with mkcert.
  # HTTPS самим MoonLan: сертификат и ключ в PEM (оба или ни одного).
  # Как выпустить их через mkcert — docs/HTTPS.md.
  # tls_cert: /opt/moonlan/tls/example.local.pem
  # tls_key: /opt/moonlan/tls/example.local-key.pem
  # A port that only redirects http:// to public_url (0 — none)
  # Порт, который только перенаправляет http:// на public_url (0 — нет)
  # http_redirect_port: 8080
  # Behind nginx or Caddy holding the TLS: the proxy's address, whose
  # X-Forwarded-For / X-Forwarded-Proto are believed; and host: 127.0.0.1
  # За nginx или Caddy, которые держат TLS: адрес прокси, чьим заголовкам
  # X-Forwarded-For / X-Forwarded-Proto верить; и host: 127.0.0.1
  # trusted_proxies: [127.0.0.1]
  # Strict-Transport-Security, seconds (0 — not sent). Browsers that saw
  # it refuse http:// for that long — see docs/HTTPS.md before setting it.
  # Strict-Transport-Security, секунды (0 — не отправлять). Увидевший его
  # браузер столько же отказывается от http:// — сначала docs/HTTPS.md.
  # hsts_max_age: 0

snmp:
  community: public # SNMP v2c community (read-only)
                    # SNMP v2c community (только чтение)
  # A timeout set too low does not show up later as a timeout — it
  # shows up as a switch that returns nothing, which is indistinguish-
  # able from one that does not implement the OID. Raise these before
  # concluding that a counter is missing.
  # Заниженный таймаут дальше по цепочке выглядит не как таймаут, а как
  # коммутатор, который ничего не отдаёт, — и это неотличимо от «OID не
  # реализован». Прежде чем решить, что счётчика нет, поднимите их.
  timeout: 5        # seconds to wait for a reply
                    # секунд на ответ
  retries: 2        # re-sends of a single request
                    # повторов одного запроса
  # A walk that stops answering mid-table is picked back up from the
  # last OID that did arrive, this many times. Not the same as
  # `retries`: a switch with many interfaces may need its table read in
  # more than one bite.
  # Walk, оборвавшийся на середине таблицы, продолжается с последнего
  # полученного OID столько раз. Это не `retries`: коммутатору с
  # большим числом интерфейсов таблицу приходится читать в несколько
  # приёмов.
  retries_on_break: 2
  # The whole poll of one switch, start to finish. `timeout` bounds one
  # request; this bounds the sum of them. A switch that runs past it is
  # left out of that scan and keeps its previous data on the map — it
  # is NOT reported as unreachable and raises no switch_down: it
  # answers, only too slowly. Raise it for a genuinely slow agent;
  # lower that device's own `timeout` instead if it is slow because it
  # does not answer at all (see the per-switch settings below).
  # Весь опрос одного коммутатора целиком. `timeout` ограничивает один
  # запрос, а это — их сумму. Не уложившийся коммутатор выпадает из
  # этого скана и остаётся на карте с прежними данными; недоступным он
  # НЕ считается и switch_down по нему не поднимается: он отвечает,
  # просто медленно. Медленному агенту бюджет поднимают; если же он
  # медленный потому, что на часть запросов не отвечает вовсе, лучше
  # уменьшить его собственный `timeout` (см. параметры на устройство).
  host_budget_seconds: 120
  # Some agents do not implement a table and cannot say so: instead of
  # answering noSuchObject, which is cheap, they go quiet and the walk
  # pays the whole retry budget for nothing — every cycle, forever.
  # After this many walks in a row that returned no rows AND ended in a
  # timeout, MoonLan stops asking that host for that OID for
  # dead_oid_cooldown_scans scans, then tries again (firmware gets
  # updated). Both the pause and the resumption are logged: data
  # missing because MoonLan stopped asking must never look like data
  # the device denies having. `python -m moonlan.diag --skipped` lists
  # what is on pause right now. 0 in dead_oid_strikes disables it.
  # Некоторые агенты не реализуют таблицу и не умеют об этом сказать:
  # вместо дешёвого noSuchObject они молчат, и walk впустую тратит весь
  # бюджет повторов — каждый цикл, всегда. После стольких walk-ов
  # подряд, вернувших ноль строк И оборвавшихся по таймауту, MoonLan
  # перестаёт спрашивать этот OID у этого хоста на
  # dead_oid_cooldown_scans сканов, потом пробует снова (прошивки
  # обновляют). И пауза, и возобновление пишутся в лог: данные,
  # которых нет потому, что MoonLan перестал спрашивать, не должны
  # выглядеть как данные, которых нет у устройства. Что сейчас на
  # паузе, показывает `python -m moonlan.diag --skipped`. 0 в
  # dead_oid_strikes выключает правило.
  dead_oid_strikes: 3
  dead_oid_cooldown_scans: 30

# IP addresses of managed switches. An entry is either an address, as
# below, or a mapping with `ip:` and any of the snmp: keys — community,
# timeout, retries, retries_on_break, host_budget_seconds — which then
# apply to that switch alone. Anything not written there is inherited
# from the snmp: section above, and `python -m moonlan.diag --config`
# prints which is which.
#
# Reach for this when one device is unlike the rest: a box that answers
# slowly (give it a short timeout and one retry, so a request it will
# never answer is given up on quickly), or a corner of the network that
# was set up years apart from the rest and has its own community.
#
# IP-адреса управляемых коммутаторов. Элемент списка — либо адрес, как
# ниже, либо отображение с `ip:` и любыми ключами из snmp: — community,
# timeout, retries, retries_on_break, host_budget_seconds, — которые
# тогда действуют только на этот коммутатор. Всё неуказанное
# наследуется из секции snmp: выше; что задано явно, а что унаследовано,
# печатает `python -m moonlan.diag --config`.
#
# Это нужно, когда одно устройство не похоже на остальные: коробка,
# которая отвечает медленно (дайте ей короткий таймаут и один повтор —
# запрос, на который она не ответит никогда, тогда бросают быстро), или
# участок сети, собранный на годы раньше прочих и со своей строкой
# сообщества.
#
# switches:
#   - 10.0.0.10                    # as before: everything from snmp:
#                                  # как раньше: всё из snmp:
#   - ip: 10.3.6.2                 # a slow box: better to give up fast
#     timeout: 2                   # медленная коробка: лучше быстро сдаться
#     retries: 1
#     host_budget_seconds: 90
#   - ip: 10.3.7.15
#     community: OtherString       # its own community
#                                  # своя строка сообщества
#     web_scheme: https            # its web interface is https only
#                                  # (the node menu's "Web interface")
#                                  # веб-интерфейс только по https
#                                  # (пункт меню «Веб-интерфейс»)
switches:
  - 192.168.1.2
  - 192.168.1.3

# Devices with an ARP table (routers, L3 switches) —
# MoonLan learns host IPs from them by MAC
# Устройства с ARP-таблицей (маршрутизаторы, L3-коммутаторы) —
# из них MoonLan узнаёт IP-адреса хостов по их MAC
routers:
  - 192.168.1.1

# Map and alarm settings are in the page since v0.8.4: the Actions menu
# → Settings. Grouping thresholds, how long devices stay on the map,
# the polling intervals, the alarm thresholds, which alarms go to which
# channel and the shared recipients are kept in the database. A value
# still written in this file is moved there at the first start and is
# not read after it — `python -m moonlan.diag --config` lists such keys.
# Параметры карты и тревог — в меню «Действия» → «Настройки» (с v0.8.4):
# пороги группировки, сколько устройства держатся на карте, интервалы
# опроса, пороги тревог, какие тревоги в какие каналы и общие
# получатели хранятся в базе. Значение, ещё записанное в этом файле,
# переносится туда при первом запуске и больше не читается —
# `python -m moonlan.diag --config` перечисляет такие ключи.

# The right-click menu of a node. Ping and traceroute run on the MoonLan
# machine, against the address MoonLan itself knows for that node —
# the page sends a node id, never an address. There is no sign-in yet,
# so anything the menu can make the server do, anybody who opens the
# page can: which is why what you add here can only be LINKS, opened
# on the machine of whoever is looking at the map. Commands run on the
# server from a template will come with sign-in, for administrators.
# Контекстное меню узла. Ping и traceroute выполняются на машине
# MoonLan и по тому адресу, который MoonLan сам знает для этого узла —
# страница присылает идентификатор, а не адрес. Авторизации пока нет,
# поэтому всё, что меню умеет делать на сервере, может сделать любой,
# кто открыл страницу: отсюда и правило — добавить сюда можно только
# ССЫЛКИ, которые открываются на машине того, кто смотрит карту.
# Команды на сервере по шаблону появятся вместе с авторизацией и только
# для администратора.
context_menu:
  # Nodes one action may name. Double-clicking a switch selects its
  # devices, sometimes a hundred; over this the action is refused with
  # the ceiling in the reason, never trimmed in silence.
  # Сколько узлов может назвать одно действие. Двойной клик по
  # коммутатору выделяет его устройства, бывает и сотню; выше потолка
  # действие отклоняется с объяснением, а не обрезается молча.
  max_targets: 64
  # Diagnostic runs on the server at once; one more is refused
  # Сколько проверок одновременно на сервере; лишняя отклоняется
  max_running: 4
  # How a switch's web interface is opened, unless its own switches:
  # entry says web_scheme (see above). http or https.
  # Как открывать веб-интерфейс коммутатора, если его запись в
  # switches: не говорит web_scheme (см. выше). http или https.
  web_scheme: http
  # Link schemes beyond http, https, ssh and telnet. javascript: and
  # data: are refused whatever is written here: a link with either
  # would run code in the browser of everybody looking at the map.
  # Схемы ссылок сверх http, https, ssh и telnet. javascript: и data:
  # не допускаются, даже если записаны здесь: такая ссылка выполнила бы
  # код в браузере каждого, кто смотрит карту.
  allowed_schemes: []
  # Your own items. {ip}, {mac}, {name}, {switch} (the switch the node
  # hangs off — its own address, for a switch) and {port} are filled
  # in and URL-encoded; an item whose value is unknown is shown greyed
  # out with the reason. applies_to: switch, host, group (a switch
  # without SNMP, "beyond the trunk", "offline"); leave it out for
  # every node. An item that cannot be used is left out of the menu,
  # with the reason in the startup log and in diag --config.
  # Свои пункты. {ip}, {mac}, {name}, {switch} (коммутатор, на котором
  # висит узел; у коммутатора — его собственный адрес) и {port}
  # подставляются и URL-кодируются; пункт, которому не хватает значения,
  # показывается серым с причиной. applies_to: switch, host, group
  # (коммутатор без SNMP, «За магистралью», «Офлайн»); без ключа — ко
  # всем узлам. Пункт, который нельзя использовать, в меню не попадает,
  # а причина — в логе старта и в diag --config.
  links: []
  #  - label: "Winbox"
  #    url: "winbox://{ip}"         # needs allowed_schemes: [winbox]
  #    applies_to: [switch]
  #  - label: "Inventory card"
  #    url: "https://inventory.local/find?mac={mac}"
  #    applies_to: [host]

# Sign-in (v0.7.4). It switches on by itself when the first
# administrator is created on the server:
#   python -m moonlan.users add <name> --role admin
# Until then the map is open to everyone, as before. These are only the
# session lifetimes.
# Вход (v0.7.4). Включается сам, когда на сервере создан первый
# администратор:
#   python -m moonlan.users add <имя> --role admin
# До тех пор карта открыта всем, как раньше. Здесь только сроки сессий.
auth:
  # Signed out after this long without a request. An open map asks the
  # server every 30 s, so it never goes idle.
  # Выход после стольких часов без запросов. Открытая карта обращается
  # к серверу каждые 30 с, поэтому сама не простаивает.
  session_idle_hours: 12
  # …and after this long in any case. A wall monitor signed in as a
  # viewer stays signed in for weeks.
  # …и после стольких дней в любом случае. Стенной монитор под
  # наблюдателем остаётся в системе неделями.
  session_max_days: 30

# The IEEE register of MAC blocks, which names the maker of a device.
# Empty — oui/ next to the database. Fill it with
# python -m moonlan.oui update, or copy the four CSV files by hand.
# Реестр IEEE блоков MAC-адресов — по нему виден производитель. Пусто —
# папка oui/ рядом с базой. Заполняется python -m moonlan.oui update
# или копированием четырёх CSV-файлов вручную.
oui:
  path: ""

# Database file (hosts, event journal)
# Файл базы данных (хосты, журнал событий)
db_path: moonlan.db

# Bridges that are supposed to be behind an access port: LLDP finds
# them, the map names them, but no unmanaged_bridge_detected alarm is
# raised. List a chassis id (MAC) or a management IP address.
# Мосты, которым положено стоять за портом доступа: LLDP их находит,
# карта показывает по имени, но тревога unmanaged_bridge_detected по
# ним не поднимается. Указывайте chassis id (MAC) или управляющий IP.
known_bridges: []
#  - 18:fd:74:fd:b5:cf
#  - 10.3.5.6

# Ports that leave the network: a provider handover, an uplink to
# someone else's equipment. Written as "<switch ip>:<port name>", the
# port name exactly as the ports panel shows it. Devices behind such a
# port are collected under one "External network" node instead of being
# drawn one by one, and a switch found there raises no bridge alarm —
# it is the boundary of your network, not something left unconfigured.
# Порты, ведущие наружу: стык с провайдером, аплинк к чужому
# оборудованию. Записываются как «<IP коммутатора>:<имя порта>», имя
# порта — ровно как в панели портов. Устройства за таким портом
# собираются в один узел «Внешняя сеть» вместо россыпи, а найденный там
# коммутатор не поднимает тревогу о мосте: это граница вашей сети, а не
# чья-то забытая настройка.
uplink_ports: []
#  - 10.0.0.10:Slot0/25

# Loop Detection (Loopback Detection, LBD) read from the vendors' own
# private MIBs — there is no standard one. Each profile says which
# sysObjectID a model answers with, where its branch starts, the
# suffixes of the four scalars and the three columns, and which raw
# status value means "no loop".
#
# Built-in profiles:
#   dlink-1210     DGS-1210-26 Rev.F1 (1.3.6.1.4.1.171.11.153.1000.17)
#                  DES-1210-28/ME     (1.3.6.1.4.1.171.10.75.15.2.17)
#   dlink-des3526  DES-3526           (1.3.6.1.4.1.171.11.64.1.2.12)
#
# A model with no profile is reported as saying nothing — no alarms and
# no "there are no loops" either. To add one: walk the vendor branch
# with `python -m moonlan.diag --walk <ip> 1.3.6.1.4.1.<enterprise>`,
# and `python -m moonlan.diag --loop` prints the sysObjectID of every
# switch still without a profile. A profile whose name repeats a
# built-in one replaces it.
#
# Loop Detection (Loopback Detection, LBD) читается из приватных MIB
# производителей — стандартной для неё нет. Профиль описывает, каким
# sysObjectID отвечает модель, где начинается её ветка, суффиксы
# четырёх скаляров и трёх колонок и какое сырое значение означает
# «петли нет».
#
# Встроенные профили — в списке выше. Коммутатор без профиля честно
# показывается как «модель не сообщает по SNMP»: ни тревог, ни
# утверждения «петель нет». Чтобы добавить свой, обойдите ветку
# `python -m moonlan.diag --walk <ip> 1.3.6.1.4.1.<enterprise>`;
# `python -m moonlan.diag --loop` печатает sysObjectID всех
# коммутаторов, оставшихся без профиля. Профиль с именем встроенного
# заменяет его.
loop_detection:
  enabled: true
  profiles: []
#    - name: edgecore-es3528m
#      roots:
#        # sysObjectID prefix: branch root
#        # префикс sysObjectID: корень ветки
#        1.3.6.1.4.1.259.6.10.94: 1.3.6.1.4.1.259.10.1.24.1.99
#      scalars:
#        enabled: "1.0"        # 1 = on / включён
#        mode: "2.0"
#        interval: "3.0"       # seconds / секунд
#        recover_time: "4.0"   # seconds / секунд
#      columns:
#        index: "5.1.1"        # port number / номер порта
#        lbd_enabled: "5.1.2"  # 1 = on, 2 = off / 1 = вкл., 2 = выкл.
#        status: "5.1.3"
#      status_type: integer    # integer | string
#      # Raw value(s) that mean "no loop". Everything else is read as a
#      # loop and its raw value goes into the alarm text.
#      # Сырое значение (значения) «петли нет». Всё остальное считается
#      # петлёй, и сырое значение попадает в текст тревоги.
#      normal: ["1"]

# Notification channels. Keep the real config.yaml (with passwords and
# tokens) OUT of git — it is listed in .gitignore.
# Каналы уведомлений. Храните боевой config.yaml (с паролями и токенами)
# ВНЕ git — он указан в .gitignore.
notifications:
  email:
    enabled: false
    smtp_host: smtp.example.com
    smtp_port: 587
    starttls: true
    username: ""
    password: ""
    mail_from: moonlan@example.com
  telegram:
    enabled: false
    bot_token: ""              # Bot API token from @BotFather
  syslog:
    enabled: false
    host: 127.0.0.1
    port: 514
