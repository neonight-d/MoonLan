<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonLan</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="moon" aria-hidden="true"></span>
      <h1>MoonLan</h1>
      <span class="tagline" data-i18n="tagline"></span>
    </div>
    <div class="toolbar">
      <span id="scan-status" class="status"></span>
      <span id="layout-status" class="status hidden"></span>
      <span class="lang-switch" role="group" aria-label="Language">
        <button id="lang-ru">RU</button><button id="lang-en">EN</button>
      </span>
      <!-- Icons, drawn here rather than taken from a font or a CDN: they
           must not depend on the outside network, and they take the
           colour of the theme — the lit state included. Each one has a
           title and an aria-label in the current language (applyStatic):
           an icon without a word is recognised by whoever drew it. -->
      <button id="freeze-btn" type="button" class="icon-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12L12.0 2.0M14.6 3.0L12.0 5.5L9.4 3.0M12 12L3.3 7.0M5.5 5.2L6.4 8.8L2.9 9.8M12 12L3.3 17.0M2.9 14.2L6.4 15.2L5.5 18.8M12 12L12.0 22.0M9.4 21.0L12.0 18.5L14.6 21.0M12 12L20.7 17.0M18.5 18.8L17.6 15.3L21.1 14.2M12 12L20.7 7.0M21.1 9.8L17.6 8.8L18.5 5.2"/></svg></button>
      <button id="arrange-btn" type="button" class="icon-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button>
      <button id="alarms-btn" type="button" class="icon-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16z"/><path d="M10.2 20.5a2 2 0 0 0 3.6 0"/></svg><span id="alarms-badge" class="badge hidden"></span></button>
      <button id="stp-btn" data-i18n="stpBtn"></button>
      <button id="journal-btn" type="button" class="icon-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6h11M9 12h11M9 18h11"/><path class="dot" d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></button>
      <!-- Actions: rescan, users, reset. A menu built from data like the
           node menu (moreItems in app.js); one more item is one more line -->
      <button id="more-btn" type="button" class="icon-btn" aria-haspopup="menu"
              aria-expanded="false" aria-controls="more-menu"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="dot" d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
      <button id="user-chip" class="user-chip hidden"></button>
      <button id="logout-btn" class="hidden" data-i18n="logoutBtn"></button>
    </div>
  </header>
  <!-- What the header has to keep saying: that the map is open to
       everybody, or (v0.7.4, over plain HTTP) that it is not encrypted -->
  <div id="notice" class="notice hidden" role="note"></div>

  <!-- Right-click menu. Its items are built from data (see
       menuItemsFor in app.js): diagnostic actions, links, the
       operator's own items from config.yaml, the layout. -->
  <div id="node-menu" class="context-menu hidden" role="menu"></div>
  <div id="more-menu" class="context-menu hidden" role="menu"
       aria-labelledby="more-btn"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main>
    <aside id="sidebar">
      <input id="search" type="search" autocomplete="off">
      <section>
        <h2><span data-i18n="switchesHeader"></span> <span id="switch-count" class="count"></span></h2>
        <ul id="switch-list" class="device-list"></ul>
      </section>
      <section>
        <h2><span data-i18n="devicesHeader"></span> <span id="host-count" class="count"></span></h2>
        <ul id="host-list" class="device-list"></ul>
      </section>
      <section id="unlocated-section" class="hidden">
        <h2><span data-i18n="unlocatedHeader"></span> <span id="unlocated-count" class="count"></span></h2>
        <ul id="unlocated-list" class="device-list"></ul>
      </section>
    </aside>

    <section id="map-panel">
      <div id="network"></div>
      <div id="details" class="panel hidden">
        <div class="panel-head">
          <h3 id="details-title"></h3>
          <button id="details-close">×</button>
        </div>
        <div class="panel-scroll"><div id="details-body"></div></div>
      </div>
      <div id="journal" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="journalTitle"></h3>
          <button id="journal-close">×</button>
        </div>
        <div class="panel-scroll"><ul id="journal-list"></ul></div>
      </div>
      <div id="ports" class="panel hidden">
        <div class="panel-head">
          <h3 id="ports-title"></h3>
          <button id="ports-close">×</button>
        </div>
        <div class="panel-scroll">
        <table class="ports-table">
          <thead>
            <tr>
              <th data-i18n="colPort" data-sort="name"></th>
              <th></th>
              <th data-i18n="colSpeed" data-sort="speed"></th>
              <th class="num" data-i18n="colIn" data-sort="in"></th>
              <th class="num" data-i18n="colOut" data-sort="out"></th>
              <th class="num" data-i18n="colErr" data-sort="err"></th>
              <th class="num" data-i18n="colDisc" data-sort="disc"></th>
              <th data-i18n="colLoop" data-sort="loop"></th>
            </tr>
          </thead>
          <tbody id="ports-body"></tbody>
        </table>
        </div>
      </div>
      <div id="alarms" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="alarmsTitle"></h3>
          <button id="alarms-close">×</button>
        </div>
        <div class="panel-scroll"><div id="alarms-body"></div></div>
      </div>
      <div id="stp" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="stpTitle"></h3>
          <button id="stp-close">×</button>
        </div>
        <div class="panel-scroll"><div id="stp-body"></div></div>
      </div>
      <!-- Ping and traceroute from the MoonLan machine, started from
           the node menu. Bottom left on purpose: a result has to
           survive a click on a node, which opens its card top right. -->
      <div id="actions" class="panel hidden">
        <div class="panel-head">
          <h3 id="actions-title"></h3>
          <button id="actions-close">×</button>
        </div>
        <div class="panel-scroll"><div id="actions-body"></div></div>
      </div>
      <!-- Your own account: password, second factor -->
      <div id="account" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="accountTitle"></h3>
          <button id="account-close">×</button>
        </div>
        <div class="panel-scroll"><div id="account-body"></div></div>
      </div>
      <!-- Accounts, for an administrator -->
      <div id="users" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="usersTitle"></h3>
          <button id="users-close">×</button>
        </div>
        <div class="panel-scroll"><div id="users-body"></div></div>
      </div>
      <div id="empty-state" class="hidden">
        <p data-i18n="emptyLine1"></p>
        <p data-i18n-html="emptyLine2"></p>
      </div>
    </section>
    <!-- Signing in, and what has to come before anything else: a
         password of one's own, an administrator's second factor. Over
         the map rather than instead of it, so a session that ended
         while the page was open carries on where it was. -->
    <div id="gate" class="gate hidden" role="dialog" aria-modal="true"
         aria-labelledby="gate-title">
      <div class="gate-card">
        <h2 id="gate-title"></h2>
        <div id="gate-body"></div>
      </div>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
