<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonLan</title>
  <link rel="stylesheet" href="style.css">
  <!-- vis-network from MoonLan itself (v0.8.3): no internet needed, and
       the Content-Security-Policy allows scripts from here only -->
  <script src="vendor/vis-network-9.1.9/vis-network.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="moon" aria-hidden="true"></span>
      <h1>MoonLan</h1>
      <span class="tagline" data-i18n="tagline"></span>
    </div>
    <!-- The status on a phone (v0.8.6): the time of the scan, and a
         mark when it is not the whole story; a tap opens the sentence
         and what is behind it, which the tooltip says on a computer -->
    <button type="button" id="status-btn" class="status-btn" aria-haspopup="dialog"
            aria-expanded="false" aria-controls="status-card"></button>
    <div class="toolbar">
      <span id="scan-status" class="status"></span>
      <span id="lang-switch" class="lang-switch" role="group">
        <button type="button" id="lang-ru">RU</button><button type="button" id="lang-en">EN</button>
      </span>
      <!-- Icons, drawn here rather than taken from a font or a CDN: they
           must not depend on the outside network, and they take the
           colour of the theme — the lit state included. Each one has a
           title and an aria-label in the current language (applyStatic):
           an icon without a word is recognised by whoever drew it. -->
      <button id="freeze-btn" type="button" class="icon-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12L12.0 2.0M14.6 3.0L12.0 5.5L9.4 3.0M12 12L3.3 7.0M5.5 5.2L6.4 8.8L2.9 9.8M12 12L3.3 17.0M2.9 14.2L6.4 15.2L5.5 18.8M12 12L12.0 22.0M9.4 21.0L12.0 18.5L14.6 21.0M12 12L20.7 17.0M18.5 18.8L17.6 15.3L21.1 14.2M12 12L20.7 7.0M21.1 9.8L17.6 8.8L18.5 5.2"/></svg></button>
      <button id="arrange-btn" type="button" class="icon-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button>
      <!-- Port numbers on the lines (v0.7.9): off, for the selection,
           everywhere — a small menu like Actions -->
      <button id="port-labels-btn" type="button" class="icon-btn" aria-haspopup="menu"
              aria-expanded="false" aria-controls="port-labels-menu"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="6.5" width="18" height="11" rx="3"/><path d="M10.5 10.5L12.5 9v6M10.5 15h4"/></svg></button>
      <button id="alarms-btn" type="button" class="icon-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16z"/><path d="M10.2 20.5a2 2 0 0 0 3.6 0"/></svg><span id="alarms-badge" class="badge hidden"></span></button>
      <button type="button" id="stp-btn" data-i18n="stpBtn"></button>
      <button id="journal-btn" type="button" class="icon-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6h11M9 12h11M9 18h11"/><path class="dot" d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></button>
      <!-- Actions: rescan, users, reset. A menu built from data like the
           node menu (moreItems in app.js); one more item is one more line -->
      <button id="more-btn" type="button" class="icon-btn" aria-haspopup="menu"
              aria-expanded="false" aria-controls="more-menu"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="dot" d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
      <button type="button" id="user-chip" class="user-chip hidden"></button>
    </div>
  </header>
  <!-- What the header has to keep saying: that the map is open to
       everybody, or (v0.7.4, over plain HTTP) that it is not encrypted -->
  <div id="notice" class="notice hidden" role="note"></div>
  <!-- The whole status line on a phone, under the header (v0.8.6) -->
  <div id="status-card" class="status-card hidden" role="dialog"
       aria-labelledby="status-card-title">
    <p id="status-card-title" class="status-card-title"></p>
    <div id="status-card-body"></div>
  </div>

  <!-- Right-click menu. Its items are built from data (see
       menuItemsFor in app.js): diagnostic actions, links, the
       operator's own items from config.yaml, the layout. -->
  <div id="node-menu" class="context-menu hidden" role="menu"></div>
  <div id="more-menu" class="context-menu hidden" role="menu"
       aria-labelledby="more-btn"></div>
  <div id="port-labels-menu" class="context-menu hidden" role="menu"></div>
  <!-- One account's actions in Users (v0.7.8): the same kind of menu -->
  <div id="user-menu" class="context-menu hidden" role="menu"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main>
    <!-- On a phone the list and the search are a section of their own,
         "Search" in the bar at the bottom (v0.8.6) -->
    <aside id="sidebar">
      <input id="search" type="search" autocomplete="off">
      <!-- Named nodes no other list has: switches without SNMP, bridges,
           external networks, groups behind a trunk (v0.8.0) -->
      <section id="named-section" class="hidden">
        <h2><span data-i18n="namedHeader"></span> <span id="named-count" class="count"></span></h2>
        <ul id="named-list" class="device-list"></ul>
      </section>
      <section>
        <h2><span data-i18n="switchesHeader"></span> <span id="switch-count" class="count"></span></h2>
        <ul id="switch-list" class="device-list"></ul>
      </section>
      <section>
        <h2><span data-i18n="devicesHeader"></span> <span id="host-count" class="count"></span></h2>
        <ul id="host-list" class="device-list"></ul>
      </section>
      <section id="unlocated-section" class="hidden">
        <h2><span data-i18n="unlocatedHeader"></span> <span id="unlocated-count" class="count"></span></h2>
        <ul id="unlocated-list" class="device-list"></ul>
      </section>
      <!-- Records nobody has seen for host_grace_hours (v0.8.7): an
           archive, folded away until somebody opens it or searches -->
      <section id="gone-section" class="hidden">
        <h2><button type="button" id="gone-toggle" class="section-toggle" aria-expanded="false"
                aria-controls="gone-list"><span class="caret" aria-hidden="true"></span><span
                data-i18n="goneHeader"></span> · <span id="gone-count" class="count"></span></button></h2>
        <ul id="gone-list" class="device-list hidden"></ul>
      </section>
    </aside>

    <section id="map-panel">
      <div id="network"></div>
      <div id="details" class="panel hidden">
        <div class="panel-head">
          <h3 id="details-title"></h3>
          <button type="button" id="details-close" data-close>×</button>
        </div>
        <div class="panel-scroll"><div id="details-body"></div></div>
      </div>
      <div id="journal" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="journalTitle"></h3>
          <button type="button" id="journal-close" data-close>×</button>
        </div>
        <!-- What to show (v0.8.6): all, or one group of events; the
             buttons are built by app.js from JOURNAL_FILTERS -->
        <div id="journal-filters" class="journal-filters" role="group"></div>
        <div class="panel-scroll">
          <ul id="journal-list"></ul>
          <button type="button" id="journal-more" class="panel-btn journal-more hidden"></button>
        </div>
      </div>
      <!-- Notes without a node, and importing and exporting notes
           (v0.8.0): one panel, filled by app.js -->
      <div id="notes-panel" class="panel hidden">
        <div class="panel-head">
          <h3 id="notes-title"></h3>
          <button type="button" id="notes-close" data-close>×</button>
        </div>
        <div class="panel-scroll"><div id="notes-body"></div></div>
      </div>
      <div id="ports" class="panel hidden">
        <div class="panel-head">
          <h3 id="ports-title"></h3>
          <button type="button" id="ports-close" data-close>×</button>
        </div>
        <div class="panel-scroll">
        <table class="ports-table">
          <thead>
            <tr>
              <th data-i18n="colPort" data-sort="name"></th>
              <th><span class="sr-only" data-i18n="colState"></span></th>
              <th data-i18n="colSpeed" data-sort="speed"></th>
              <th class="num" data-sort="in"><span class="th-full" data-i18n="colIn"></span><span class="th-short" data-i18n="colInShort"></span></th>
              <th class="num" data-sort="out"><span class="th-full" data-i18n="colOut"></span><span class="th-short" data-i18n="colOutShort"></span></th>
              <th class="num" data-sort="err"><span class="th-full" data-i18n="colErr"></span><span class="th-short" data-i18n="colErrShort"></span></th>
              <th class="num" data-sort="disc"><span class="th-full" data-i18n="colDisc"></span><span class="th-short" data-i18n="colDiscShort"></span></th>
              <th data-i18n="colLoop" data-sort="loop"></th>
            </tr>
          </thead>
          <tbody id="ports-body"></tbody>
        </table>
        </div>
      </div>
      <div id="alarms" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="alarmsTitle"></h3>
          <button type="button" id="alarms-close" data-close>×</button>
        </div>
        <div class="panel-scroll"><div id="alarms-body"></div></div>
      </div>
      <div id="stp" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="stpTitle"></h3>
          <button type="button" id="stp-close" data-close>×</button>
        </div>
        <div class="panel-scroll"><div id="stp-body"></div></div>
      </div>
      <!-- Ping and traceroute from the MoonLan machine, started from
           the node menu. Bottom left on purpose: a result has to
           survive a click on a node, which opens its card top right. -->
      <div id="actions" class="panel hidden">
        <div class="panel-head">
          <h3 id="actions-title"></h3>
          <button type="button" id="actions-close" data-close>×</button>
        </div>
        <div class="panel-scroll"><div id="actions-body"></div></div>
      </div>
      <!-- Your own account: password, second factor -->
      <div id="account" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="accountTitle"></h3>
          <button type="button" id="account-close" data-close>×</button>
        </div>
        <div class="panel-scroll"><div id="account-body"></div></div>
      </div>
      <!-- Accounts, for an administrator -->
      <div id="users" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="usersTitle"></h3>
          <button type="button" id="users-close" data-close>×</button>
        </div>
        <div class="panel-scroll"><div id="users-body"></div></div>
      </div>
      <!-- Settings (v0.8.4): the map's and the alarms' settings, and
           one's own notifications -->
      <div id="settings" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="settingsTitle"></h3>
          <button type="button" id="settings-close" data-close>×</button>
        </div>
        <div class="panel-scroll"><div id="settings-body"></div></div>
      </div>
      <!-- About (v0.8.1): version, build, licence, components -->
      <div id="about" class="panel hidden">
        <div class="panel-head">
          <h3 data-i18n="aboutTitle"></h3>
          <button type="button" id="about-close" data-close>×</button>
        </div>
        <div class="panel-scroll"><div id="about-body"></div></div>
      </div>
      <!-- The map's tools on a phone (v0.8.6), over the map, under the
           thumb: freeze, port numbers, fit the map to the screen -->
      <div id="map-tools" class="map-tools">
        <button type="button" id="tool-freeze" class="map-tool"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12L12.0 2.0M14.6 3.0L12.0 5.5L9.4 3.0M12 12L3.3 7.0M5.5 5.2L6.4 8.8L2.9 9.8M12 12L3.3 17.0M2.9 14.2L6.4 15.2L5.5 18.8M12 12L12.0 22.0M9.4 21.0L12.0 18.5L14.6 21.0M12 12L20.7 17.0M18.5 18.8L17.6 15.3L21.1 14.2M12 12L20.7 7.0M21.1 9.8L17.6 8.8L18.5 5.2"/></svg></button>
        <button type="button" id="tool-ports" class="map-tool" aria-haspopup="menu"
                aria-expanded="false" aria-controls="port-labels-menu"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="6.5" width="18" height="11" rx="3"/><path d="M10.5 10.5L12.5 9v6M10.5 15h4"/></svg></button>
        <button type="button" id="tool-fit" class="map-tool"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
      <!-- Arranging is on: said on the map itself on a phone, where the
           header's button that showed it is gone (v0.8.6) -->
      <div id="arrange-banner" class="arrange-banner hidden" role="status">
        <span id="arrange-banner-text"></span>
        <button type="button" id="arrange-banner-off"></button>
      </div>
      <div id="empty-state" class="hidden">
        <p data-i18n="emptyLine1"></p>
        <p data-i18n-html="emptyLine2"></p>
        <p id="empty-config" class="hidden"></p>
      </div>
    </section>
    <!-- "More" on a phone (v0.8.6): the account, the language, STP,
         arranging and the Actions menu's items, from the same data -->
    <div id="more-view" class="phone-view hidden" role="region" aria-labelledby="tab-more">
      <div id="more-body"></div>
    </div>
    <!-- Signing in, and what has to come before anything else: a
         password of one's own, an administrator's second factor. Over
         the map rather than instead of it, so a session that ended
         while the page was open carries on where it was. -->
    <div id="gate" class="gate hidden" role="dialog" aria-modal="true"
         aria-labelledby="gate-title">
      <div class="gate-card">
        <h2 id="gate-title"></h2>
        <div id="gate-body"></div>
      </div>
    </div>
    <!-- Exporting the map (v0.8.1): PDF, Draw.io, SVG -->
    <div id="export-dialog" class="gate hidden" role="dialog" aria-modal="true"
         aria-labelledby="export-title">
      <div class="gate-card export-card">
        <h2 id="export-title"></h2>
        <button id="export-close" class="dialog-close" type="button" data-close>×</button>
        <div id="export-body"></div>
      </div>
    </div>
  </main>
  <!-- The sections on a phone (v0.8.6): at the bottom, under the
       thumb. Not shown wider than 720 px. -->
  <nav id="tabbar" class="tabbar">
    <button type="button" id="tab-map" class="tab" data-tab="map"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span class="tab-label" data-i18n="tabMap"></span></button>
    <button type="button" id="tab-search" class="tab" data-tab="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="tab-label" data-i18n="tabSearch"></span></button>
    <button type="button" id="tab-alarms" class="tab" data-tab="alarms"><span class="tab-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16z"/><path d="M10.2 20.5a2 2 0 0 0 3.6 0"/></svg><span id="tab-alarms-badge" class="badge hidden"></span></span><span class="tab-label" data-i18n="tabAlarms"></span></button>
    <button type="button" id="tab-journal" class="tab" data-tab="journal"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6h11M9 12h11M9 18h11"/><path class="dot" d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span class="tab-label" data-i18n="tabJournal"></span></button>
    <button type="button" id="tab-more" class="tab" data-tab="more"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="dot" d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span class="tab-label" data-i18n="tabMore"></span></button>
  </nav>
  <!-- The map on paper (v0.8.1): filled by printSchema, shown only in
       print; the size of the paper is the @page rule in the style -->
  <div id="print-sheet"></div>
  <style id="print-page"></style>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
