name: docker

# The image (v0.8.3). Every push to main, every pull request and every
# tag builds it for amd64 and runs it — .github/docker-check.sh: the
# demo, the console through docker exec, ping, a stop and a start, the
# example docker-compose.yml, the health check. A tag v* that passes is
# then built for amd64 and arm64 and published to Docker Hub and to
# GitHub's registry; nothing else is ever published.
#
# The actions are pinned to the commit of the release named beside
# each: the publishing job holds the Docker Hub token.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: The build About shows
        id: build
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build for amd64, not published
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: moonlan:check
          build-args: MOONLAN_BUILD=${{ steps.build.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it as an operator would
        run: .github/docker-check.sh moonlan:check ${{ steps.build.outputs.short }}

  publish:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: The build About shows
        id: build
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.8.3 → 0.8.3, 0.8, latest; a pre-release (v0.9.0-rc1) gets
      # its own tag only — no 0.9, no latest
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            docker.io/neonight/moonlan
            ghcr.io/neonight-d/moonlan
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=MoonLan
            org.opencontainers.image.description=A self-hosted Linux service that discovers the physical LAN topology from switch data over SNMP and shows it live in a browser
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/neonight-d/MoonLan

      - name: Build for amd64 and arm64, and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MOONLAN_BUILD=${{ steps.build.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
